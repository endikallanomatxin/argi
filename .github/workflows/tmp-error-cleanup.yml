name: Temporary error propagation cleanup

on:
  push:
    branches:
      - compact-semantic-graph-chatgpt

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: compact-semantic-graph-chatgpt
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Apply error cleanup restoration
        run: |
          python3 .github/tmp-error-cleanup.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/4_semantics/global/ownership.zig')
          s = p.read_text().replace('try std.testing.expect(cleanup.start <= graph.node_refs.items.len);', 'try std.testing.expect(cleanup.start != 0);')
          p.write_text(s)
          PY
      - name: Format ownership resolver
        run: zig fmt src/4_semantics/global/ownership.zig
      - name: Run internal tests
        run: zig build test-internal
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/4_semantics/global/ownership.zig
          git commit -m "Restore error propagation cleanup"
          git push origin HEAD:compact-semantic-graph-chatgpt
