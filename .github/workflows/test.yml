name: Test

"on":
  workflow_dispatch:
    inputs:
      native_matrix:
        description: Optional native runner matrix JSON for focused diagnosis
        type: string
        default: ''
  push:
    branches: [develop, feature/bytecode-execution]
  pull_request:
    branches: [develop]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/build.yml
    with:
      package: true
      native_matrix: ${{ inputs.native_matrix || '' }}
