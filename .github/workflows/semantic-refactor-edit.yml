name: Verified semantic refactor edit

on:
  push:
    branches:
      - compact-semantic-graph-chatgpt
    paths:
      - .github/semantic_refactor_edit.py
      - .github/semantic_refactor_post_edit.py
      - .github/semantic_refactor_test_command
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: semantic-refactor-edit
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Install LLVM 21
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo "deb https://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" | sudo tee /etc/apt/sources.list.d/llvm-21.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends llvm-21-dev
      - name: Apply semantic edit
        run: |
          python3 .github/semantic_refactor_edit.py
          if [[ -f .github/semantic_refactor_post_edit.py ]]; then
            python3 .github/semantic_refactor_post_edit.py
          fi
      - name: Build compiler
        timeout-minutes: 5
        run: zig build
      - name: Run internal tests
        timeout-minutes: 5
        run: zig build test-internal
      - name: Run focused semantic tests
        timeout-minutes: 8
        shell: bash
        run: |
          if [[ -f .git/semantic-refactor-test-command ]]; then
            bash -euo pipefail -c "$(cat .git/semantic-refactor-test-command)"
          elif [[ -f .github/semantic_refactor_test_command ]]; then
            bash -euo pipefail -c "$(cat .github/semantic_refactor_test_command)"
          fi
      - name: Commit verified source edit
        shell: bash
        run: |
          if git diff --quiet -- src tests; then
            echo "No source changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git commit -m "$(cat .git/semantic-refactor-message)"
          git push origin HEAD:compact-semantic-graph-chatgpt
