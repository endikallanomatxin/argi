name: Focused semantic refactor test

on:
  push:
    branches:
      - compact-semantic-graph-chatgpt
    paths:
      - src/**
      - core/**
      - tests/**
      - .github/semantic_refactor_test_command
      - .github/workflows/semantic-refactor-edit.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: semantic-refactor-focused
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Install LLVM 21
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo "deb https://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" | sudo tee /etc/apt/sources.list.d/llvm-21.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends llvm-21-dev
      - name: Run focused semantic test
        timeout-minutes: 8
        shell: bash
        run: |
          set -o pipefail
          bash -euo pipefail -c "$(cat .github/semantic_refactor_test_command)" 2>&1 | tee focused-semantic-test.log
      - name: Summarize focused result
        if: always()
        shell: bash
        run: |
          {
            echo "### Focused semantic refactor test"
            echo
            echo '~~~text'
            grep -E "Build Summary:|run test [0-9]+ pass|error: 'test\.test\.|indexed semantizing failed" focused-semantic-test.log 2>/dev/null | tail -80 || true
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload focused-test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: focused-semantic-test
          path: focused-semantic-test.log
          if-no-files-found: ignore
          retention-days: 7
