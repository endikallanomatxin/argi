name: Remove Declaration syntax-node storage

on:
  push:
    branches:
      - compact-semantic-graph-chatgpt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove Declaration syntax-node storage
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/4_semantics/module/graph.zig')
          s = p.read_text()
          old = '    syntax_node: syn.NodeIndex,\n'
          assert s.count(old) == 1
          s = s.replace(old, '', 1)
          old = '            .syntax_node = node,\n'
          assert s.count(old) == 1
          s = s.replace(old, '', 1)
          p.write_text(s)

          removals = {
              'src/4_semantics/module/parameterized/verify.zig': ('        .syntax_node = @enumFromInt(1),\n', 1),
              'src/4_semantics/global/expressions.zig': (' .syntax_node = @enumFromInt(0)', 2),
              'src/4_semantics/semantic_representation_test.zig': ('        .syntax_node = @enumFromInt(0),\n', 1),
          }
          for path, (old, expected) in removals.items():
              p = Path(path)
              s = p.read_text()
              count = s.count(old)
              assert count == expected, f'{path}: expected {expected} fixture occurrences, got {count}'
              s = s.replace(old, '')
              p.write_text(s)
          PY
          git checkout HEAD -- .github/workflows/compact-semantic-graph.yml

      - name: Require syntax-free ModuleSG declarations
        run: |
          if grep -R -n "\.syntax_node" src/4_semantics; then
            echo "Declaration syntax-node use remains in semantics" >&2
            exit 1
          fi

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install LLVM 21
        run: |
          sudo apt-get update
          sudo apt-get install -y wget ca-certificates gnupg
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get install -y llvm-21-dev clang-21

      - name: Build compiler
        run: zig build

      - name: Run internal tests
        timeout-minutes: 5
        run: zig build test-internal

      - name: Commit validated cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/4_semantics/module/graph.zig src/4_semantics/module/parameterized/verify.zig src/4_semantics/global/expressions.zig src/4_semantics/semantic_representation_test.zig
          git commit -m "Remove Declaration syntax-node storage"
          git push origin HEAD:compact-semantic-graph-chatgpt
