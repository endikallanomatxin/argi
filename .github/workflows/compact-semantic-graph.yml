name: Compact semantic graph offset trace

on:
  push:
    branches:
      - compact-semantic-graph-chatgpt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show unresolved source offsets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path("core/system/terminal.rg").read_text()
          for offset in (5235, 6202):
              line = s.count("\n", 0, offset) + 1
              start = s.rfind("\n", 0, offset) + 1
              end = s.find("\n", offset)
              if end < 0: end = len(s)
              print(f"offset={offset} line={line} column={offset-start+1}: {s[start:end]}")
              print(repr(s[max(0, offset-80):min(len(s), offset+120)]))
          PY
