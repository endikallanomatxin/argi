name: Compact semantic graph stabilization probe

on:
  push:
    branches:
      - compact-semantic-graph-chatgpt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply semantic stabilization probes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("src/4_semantics/module/initializer_lowerer.zig")
          s = p.read_text()
          old_calls = '''    try ctx.lowerDeferredStructDefinitions();\n    try ctx.lowerDeferredFunctionInterfaces();'''
          new_calls = '''    try ctx.lowerDeferredStructDefinitions();\n    try ctx.lowerDeferredChoiceDefinitions();\n    try ctx.lowerDeferredFunctionInterfaces();'''
          marker = '''    fn lowerDeferredFunctionInterfaces(self: *Context) !void {'''
          helper = '''    /// Finish non-generic choice declarations whose payload types could not\n    /// be represented by the compatibility builder because they cross a\n    /// module boundary. Canonical ModuleSema can retain those types as\n    /// ExternalRef-backed slots, so the declared choice shape stays complete.\n    fn lowerDeferredChoiceDefinitions(self: *Context) !void {\n        for (self.graph.declarations.items, 0..) |declaration, raw| {\n            if (declaration.kind != .type or declaration.choice_variants != null) continue;\n            self.selectFile(declaration.module_file_index);\n            const type_declaration = self.tree.typeDeclaration(declaration.syntax_node) orelse continue;\n            if (type_declaration.generic_params.len != 0 or type_declaration.generic_params_struct != null) continue;\n            const literal = self.tree.choiceTypeLiteral(type_declaration.value) orelse continue;\n            const start: u32 = @intCast(views.variantCount(self.graph));\n            for (literal.variants, 0..) |variant_node, index| {\n                const variant = self.tree.choiceTypeVariant(variant_node) orelse return error.InvalidChoiceVariant;\n                const name_text = self.tree.tokenTextFromSource(self.source, variant.name_token);\n                var option_decl: ?entities.ModuleDeclId = null;\n                if (variant.module_qualifier == null) {\n                    for (self.graph.declarationsNamed(name_text)) |candidate| {\n                        if (self.graph.declarations.items[@intFromEnum(candidate)].kind != .choice_option) continue;\n                        option_decl = candidate;\n                        break;\n                    }\n                }\n                _ = try self.writer.addVariant(.{\n                    .name = try self.writer.addString(name_text),\n                    .payload_type = if (variant.payload_type) |payload| try self.lowerType(payload) else null,\n                    .option_decl = option_decl,\n                    .source = self.sourceRef(variant_node),\n                    .value = @intCast(index),\n                });\n            }\n            self.graph.declarations.items[raw].choice_variants = .{ .start = start, .len = @intCast(literal.variants.len) };\n        }\n    }\n\n'''
          assert s.count(old_calls) == 1
          assert s.count(marker) == 1
          p.write_text(s.replace(old_calls, new_calls, 1).replace(marker, helper + marker, 1))

          p = Path("src/4_semantics/global/core.zig")
          s = p.read_text()
          old = '''                const reference = module.semantic.external_refs.items[@intFromEnum(external)];\n                if (reference.kind != .type) continue;\n                // Generic external references need parameterized substitution and are\n                // intentionally claimed by the generic resolver instead.\n                if (reference.generic_arguments != null) continue;\n                const target = self.resolveDeclaration(module_index, reference, &.{ .type, .abstract_type }) catch continue;'''
          new = '''                const reference = module.semantic.external_refs.items[@intFromEnum(external)];\n                if (reference.kind != .type) continue;\n                if (reference.module_path == null and reference.generic_arguments == null) {\n                    const name = module.text(reference.name);\n                    var resolved_builtin: ?primitives.BuiltinType = null;\n                    inline for (@typeInfo(primitives.BuiltinType).@\"enum\".fields) |field| {\n                        if (std.mem.eql(u8, name, field.name)) { resolved_builtin = @enumFromInt(field.value); break; }\n                    }\n                    if (resolved_builtin) |builtin_type| {\n                        self.graph.types.items[@intFromEnum(globalizer.globalType(o, local_id))] = .{ .builtin = builtin_type };\n                        self.stats.external_types += 1;\n                        continue;\n                    }\n                }\n                // Generic external references need parameterized substitution and are\n                // intentionally claimed by the generic resolver instead.\n                if (reference.generic_arguments != null) continue;\n                const target = self.resolveDeclaration(module_index, reference, &.{ .type, .abstract_type }) catch continue;'''
          assert s.count(old) == 1
          p.write_text(s.replace(old, new, 1))

          p = Path("src/4_semantics/global/ownership.zig")
          s = p.read_text()
          old = '''        const nodes = self.graph.node_refs.items[original.nodes.start..][0..original.nodes.len];\n        for (nodes) |node_id| {'''
          new = '''        // Recursive finalization appends cleanup edges to graph.node_refs and\n        // may reallocate it. Keep a stable copy of this block's original node IDs.\n        const nodes = try self.allocator.dupe(global_sg.GlobalNodeId, self.graph.node_refs.items[original.nodes.start..][0..original.nodes.len]);\n        defer self.allocator.free(nodes);\n        for (nodes) |node_id| {'''
          assert s.count(old) == 1
          p.write_text(s.replace(old, new, 1))

          p = Path("src/4_semantics/global/abstracts.zig")
          s = p.read_text()
          old = '''        const registry_start: u32 = @intCast(self.graph.virtual_registries.items.len);\n        for (methods.items, 0..) |_, index| try self.graph.virtual_registries.append(self.allocator, .{\n            .implementations = .{ .start = method_start + @as(u32, @intCast(index)), .len = 1 },\n        });\n        const virtual_ty = try self.generics.internType(.{ .virtual = abstract_ty });'''
          new = '''        // Virtualize.safety_methods is a range into virtual_registry_refs, not\n        // directly into virtual_registries. Keep the indirection explicit so\n        // later registries can be non-contiguous without corrupting the range.\n        const safety_start: u32 = @intCast(self.graph.virtual_registry_refs.items.len);\n        for (methods.items, 0..) |_, index| {\n            const registry: global_sg.GlobalVirtualRegistryId = @enumFromInt(@as(u32, @intCast(self.graph.virtual_registries.items.len)));\n            try self.graph.virtual_registries.append(self.allocator, .{\n                .implementations = .{ .start = method_start + @as(u32, @intCast(index)), .len = 1 },\n            });\n            try self.graph.virtual_registry_refs.append(self.allocator, registry);\n        }\n        const virtual_ty = try self.generics.internType(.{ .virtual = abstract_ty });'''
          old_range = '''            .safety_methods = .{ .start = registry_start, .len = @intCast(methods.items.len) },'''
          new_range = '''            .safety_methods = .{ .start = safety_start, .len = @intCast(methods.items.len) },'''
          assert s.count(old) == 1
          assert s.count(old_range) == 1
          p.write_text(s.replace(old, new, 1).replace(old_range, new_range, 1))
          PY

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install LLVM 21
        run: |
          sudo apt-get update
          sudo apt-get install -y wget ca-certificates gnupg
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get install -y llvm-21-dev clang-21

      - name: Build compiler
        run: zig build

      - name: Run internal tests
        timeout-minutes: 5
        run: zig build test-internal

      - name: Run program suite
        timeout-minutes: 15
        run: zig build test-programs
