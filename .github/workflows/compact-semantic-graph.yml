name: Share initializer expression lowering

on:
  push:
    branches:
      - compact-semantic-graph-chatgpt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Route global initializers through body expression lowering
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64

          def d(value):
              return base64.b64decode(value).decode()

          def replace(path, old64, new64, expected=1):
              p = Path(path)
              s = p.read_text()
              old = d(old64)
              new = d(new64)
              count = s.count(old)
              assert count == expected, f'{path}: expected {expected}, got {count}'
              p.write_text(s.replace(old, new, expected))

          body = 'src/4_semantics/module/body_lowerer.zig'
          init = 'src/4_semantics/module/initializer_lowerer.zig'

          replace(body,
              'Y29uc3QgTG93ZXJlZCA9IHN0cnVjdCB7IG5vZGU6IGVudGl0aWVzLk1vZHVsZU5vZGVJZCwgdHk6ID9lbnRpdGllcy5Nb2R1bGVUeXBlSWQgfTsK',
              'cHViIGNvbnN0IExvd2VyZWQgPSBzdHJ1Y3QgeyBub2RlOiBlbnRpdGllcy5Nb2R1bGVOb2RlSWQsIHR5OiA/ZW50aXRpZXMuTW9kdWxlVHlwZUlkIH07CmNvbnN0IEV4cHJlc3Npb25Nb2RlID0gZW51bSB7IGJvZHksIGluaXRpYWxpemVyIH07Cg==')

          p = Path(body)
          s = p.read_text()
          marker = d('Y29uc3QgQ29udGV4dCA9IHN0cnVjdCB7Cg==')
          wrapper = d('')
          assert s.count(marker) == 1
          s = s.replace(marker, wrapper + marker, 1)
          p.write_text(s)

          replace(body,
              'ICAgIHBpcGVfdmFsdWU6ID9Mb3dlcmVkID0gbnVsbCwK',
              'ICAgIHBpcGVfdmFsdWU6ID9Mb3dlcmVkID0gbnVsbCwKICAgIGV4cHJlc3Npb25fbW9kZTogRXhwcmVzc2lvbk1vZGUgPSAuYm9keSwK')
          replace(body,
              'ICAgIGZuIGxvd2VyTm9kZShzZWxmOiAqQ29udGV4dCwgbm9kZTogc3luLk5vZGVJbmRleCwgZXhwZWN0ZWQ6ID9lbnRpdGllcy5Nb2R1bGVUeXBlSWQpIGFueWVycm9yIUxvd2VyZWQgewogICAgICAgIHJldHVybiBzd2l0Y2ggKHNlbGYudHJlZS50YWcobm9kZSkpIHsK',
              '')

          p = Path(body)
          s = p.read_text()
          marker = d('ICAgIGZuIHB1c2hTY29wZShzZWxmOiAqQ29udGV4dCkgIXZvaWQgewo=')
          helper = d('')
          assert s.count(marker) == 1
          s = s.replace(marker, helper + marker, 1)
          p.write_text(s)

          replace(init,
              'Y29uc3QgZ3JhcGhfbW9kID0gQGltcG9ydCgiZ3JhcGguemlnIik7Cg==',
              'Y29uc3QgZ3JhcGhfbW9kID0gQGltcG9ydCgiZ3JhcGguemlnIik7CmNvbnN0IGJvZHlfbG93ZXJlciA9IEBpbXBvcnQoImJvZHlfbG93ZXJlci56aWciKTsK')
          replace(init,
              '',
              '')
          PY

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install LLVM 21
        run: |
          sudo apt-get update
          sudo apt-get install -y wget ca-certificates gnupg
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get install -y llvm-21-dev clang-21

      - name: Build compiler
        run: zig build

      - name: Run internal tests
        timeout-minutes: 5
        run: zig build test-internal

      - name: Commit validated refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/4_semantics/module/body_lowerer.zig src/4_semantics/module/initializer_lowerer.zig
          git commit -m "Share global initializer expression lowering"
          git push origin HEAD:compact-semantic-graph-chatgpt
