name: Compact semantic graph

on:
  push:
    branches:
      - compact-semantic-graph-chatgpt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install LLVM
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-18-dev clang-18
          zig version
          llvm-config-18 --version

      - name: Apply verified Zig 0.16 migration fixes
        if: github.actor != 'github-actions[bot]'
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replacements(path, pairs):
              p = Path(path)
              text = p.read_text()
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f"expected pattern not found in {path}: {old!r}")
                  text = text.replace(old, new)
              p.write_text(text)

          replacements('src/4_semantics/global_safety_checker.zig', [
              ('if (statement.choice_test) |test| self.refineChoice(&then_state, test.choice_value, test.variant, test.then_has_variant);',
               'if (statement.choice_test) |choice_test| self.refineChoice(&then_state, choice_test.choice_value, choice_test.variant, choice_test.then_has_variant);'),
              ('if (statement.choice_test) |test| self.refineChoice(&else_state, test.choice_value, test.variant, !test.then_has_variant);',
               'if (statement.choice_test) |choice_test| self.refineChoice(&else_state, choice_test.choice_value, choice_test.variant, !choice_test.then_has_variant);'),
          ])

          replacements('src/4_semantics/global_semantic_abstracts.zig', [
              ('.declared => |decl| blk: {', '.declared => |decl| {'),
          ])

          for path in ['src/4_semantics/global_semantic_control.zig', 'src/4_semantics/global_semantic_core.zig']:
              replacements(path, [
                  ('fn builtin(self: *Resolver, builtin: primitives.BuiltinType)', 'fn builtin(self: *Resolver, builtin_type: primitives.BuiltinType)'),
                  ('if (value == builtin) return', 'if (value == builtin_type) return'),
                  ('.{ .builtin = builtin });', '.{ .builtin = builtin_type });'),
              ])

          replacements('src/4_semantics/global_semantic_generic_functions.zig', [
              ('.resolve_field => |value| self.resolveField(value.value, value.field_name, value.source),',
               '.resolve_field => |value| self.resolveTemplateField(value.value, value.field_name, value.source),'),
              ('fn resolveField(self: *InstanceContext, value: ir.TemplateNodeId, field_name: primitives.StringRange, source: primitives.SourceRef)',
               'fn resolveTemplateField(self: *InstanceContext, value: ir.TemplateNodeId, field_name: primitives.StringRange, source: primitives.SourceRef)'),
          ])

          replacements('src/4_semantics/global_semantic_generics.zig', [
              ('.generic => if (try self.ensureGenericInstance(id)) changed = true,',
               '.generic => { if (try self.ensureGenericInstance(id)) changed = true; },'),
          ])

          replacements('src/4_semantics/module_fallback_lowerer.zig', [
              ('const pending = try self.writer.addPendingOperation(.{ .resolve_match_case = .{',
               'const pending_id = try self.writer.addPendingOperation(.{ .resolve_match_case = .{'),
              ('const stored = try self.writer.addNode(.{ .pending = pending });',
               'const stored = try self.writer.addNode(.{ .pending = pending_id });'),
              ('fn pending(self: *Context, node: syn.NodeIndex, operation: entities.PendingOperation, ty: entities.ModuleTypeId) !Lowered {\n        const id = try self.writer.addPendingNode(operation);',
               'fn pending(self: *Context, node: syn.NodeIndex, operation: entities.PendingOperation, ty: entities.ModuleTypeId) !Lowered {\n        _ = node;\n        const id = try self.writer.addPendingNode(operation);'),
          ])

          replacements('src/4_semantics/module_initializer_lowerer.zig', [
              ('const pending = try self.writer.addPendingOperation(.{ .resolve_field = .{',
               'const pending_id = try self.writer.addPendingOperation(.{ .resolve_field = .{'),
              ('const stored = try self.writer.addNode(.{ .pending = pending });',
               'const stored = try self.writer.addNode(.{ .pending = pending_id });'),
              ('const pending = entities.PendingExpression{', 'const pending_expression = entities.PendingExpression{'),
              ('return self.pending(.{ .resolve_expression = pending }, expected orelse try self.builtin(.Any));',
               'return self.pending(.{ .resolve_expression = pending_expression }, expected orelse try self.builtin(.Any));'),
              ('fn pendingNamed(self: *Context, node: syn.NodeIndex, kind: entities.PendingExpressionKind, text: []const u8, expected: ?entities.ModuleTypeId) !Lowered {\n        return self.pending',
               'fn pendingNamed(self: *Context, node: syn.NodeIndex, kind: entities.PendingExpressionKind, text: []const u8, expected: ?entities.ModuleTypeId) !Lowered {\n        _ = node;\n        return self.pending'),
              ('.resolved => |resolved| switch (resolved) { .builtin => |builtin_value| builtin_value == .Any, else => false },',
               '.resolved => |resolved_type| switch (resolved_type) { .builtin => |builtin_value| builtin_value == .Any, else => false },'),
          ])

          replacements('src/4_semantics/module_template_lowerer.zig', [
              ('if (self.parameter(name)) |parameter| if (parameter.kind == .type) return self.addType(.{ .parameter = parameter.id });',
               'if (self.parameter(name)) |binding| if (binding.kind == .type) return self.addType(.{ .parameter = binding.id });'),
              ('if (self.parameter(text)) |parameter| if (parameter.kind == .comptime_int) {\n            return self.addInt(.{ .parameter = parameter.id });',
               'if (self.parameter(text)) |binding| if (binding.kind == .comptime_int) {\n            return self.addInt(.{ .parameter = binding.id });'),
              ('const parameter = self.parameter(name) orelse return error.UnknownTemplateComptimeParameter;\n            if (parameter.kind != .comptime_int) return error.ExpectedTemplateComptimeParameter;\n            return self.addInt(.{ .parameter = parameter.id });',
               'const binding = self.parameter(name) orelse return error.UnknownTemplateComptimeParameter;\n            if (binding.kind != .comptime_int) return error.ExpectedTemplateComptimeParameter;\n            return self.addInt(.{ .parameter = binding.id });'),
          ])

          replacements('src/5_codegen/global_codegen.zig', [
              ('self.literal(', 'self.emitLiteral('),
              ('fn literal(self: *CodeGenerator, node_id: graph_mod.GlobalNodeId)', 'fn emitLiteral(self: *CodeGenerator, node_id: graph_mod.GlobalNodeId)'),
              ('self.comparison(', 'self.emitComparison('),
              ('fn comparison(self: *CodeGenerator, comparison: anytype)', 'fn emitComparison(self: *CodeGenerator, comparison: anytype)'),
              ('if (record.initialization) |init| {\n            const value = try self.globalConstant(init);',
               'if (record.initialization) |initialization| {\n            const value = try self.globalConstant(initialization);'),
              ('if (statement.init) |init| _ = try self.visitNode(init);',
               'if (statement.init) |initialization| _ = try self.visitNode(initialization);'),
              ('const i32 = c.LLVMInt32Type();', 'const i32_ty = c.LLVMInt32Type();'),
              ('{ i32, argv_ty }', '{ i32_ty, argv_ty }'),
              ('LLVMFunctionType(i32,', 'LLVMFunctionType(i32_ty,'),
              ('LLVMConstInt(i32,', 'LLVMConstInt(i32_ty,'),
          ])
          PY

      - name: Commit migration fixes
        if: github.actor != 'github-actions[bot]'
        run: |
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add src
            git commit -m "Fix Zig 0.16 migration diagnostics"
            git push
          fi

      - name: Run test suite
        run: zig build test
