name: Authoritative struct literal typing

on:
  push:
    branches:
      - compact-semantic-graph-chatgpt

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply migration
        run: |
          python3 .github/scripts/authoritative_struct_literal_type.py
          python3 - <<'PY'
          from pathlib import Path

          core = Path('src/4_semantics/global/core.zig')
          text = core.read_text()
          text = text.replace(
              '        self.graph.nodes.items[@intFromEnum(node)].content.struct_value_literal.ty = target;\n',
              '',
              1,
          )
          text = text.replace(
              '        .content = .{ .struct_value_literal = .{ .fields = .{ .start = 0, .len = 1 }, .ty = input_ty } },\n',
              '        .content = .{ .struct_value_literal = .{ .fields = .{ .start = 0, .len = 1 } } },\n',
              1,
          )
          core.write_text(text)

          constructors = Path('src/4_semantics/global/constructors.zig')
          text = constructors.read_text()
          text = text.replace(
              '''            .content = .{ .struct_value_literal = .{
                .fields = .{ .start = 0, .len = 0 },
                .ty = input_type,
            } },
''',
              '''            .content = .{ .struct_value_literal = .{
                .fields = .{ .start = 0, .len = 0 },
            } },
''',
              1,
          )
          constructors.write_text(text)
          PY
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Install LLVM 21
        run: |
          sudo apt-get update
          sudo apt-get install -y wget ca-certificates gnupg
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get install -y llvm-21-dev clang-21
      - name: Build compiler
        run: zig build
      - name: Run internal tests
        timeout-minutes: 5
        run: zig build test-internal
      - name: Commit source migration
        run: |
          if git diff --quiet -- src/4_semantics src/5_codegen; then
            echo "No source changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/4_semantics src/5_codegen
          git commit -m "Make node type authoritative for struct literals"
          git push origin HEAD:compact-semantic-graph-chatgpt
