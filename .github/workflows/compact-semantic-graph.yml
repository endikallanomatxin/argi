name: Type resolution ownership

on:
  push:
    branches:
      - compact-semantic-graph-chatgpt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify type resolution ownership
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/4_semantics/global/core.zig')
          text = path.read_text()
          old = '.resolve_type => |value| resolution.Result.fromBool(try self.resolveTypeHole(module_index, module, o, value)),'
          assert text.count(old) == 1
          text = text.replace(old, '.resolve_type => |value| try self.resolveTypeHole(module_index, module, o, value),', 1)
          start = text.index('    fn resolveTypeHole(')
          end = text.index('\n    fn resolveCall(', start)
          block = text[start:end]
          assert ') !bool {' in block
          block = block.replace(') !bool {', ') !resolution.Result {', 1)
          block = block.replace('if (reference.generic_arguments != null) return false;', 'if (reference.generic_arguments != null) return .not_applicable;', 1)
          block = block.replace('catch return false;', 'catch return .deferred;', 1)
          block = block.replace('        return true;', '        return .resolved;', 1)
          text = text[:start] + block + text[end:]
          path.write_text(text)

          path = Path('src/4_semantics/global/generics.zig')
          text = path.read_text()
          old = '.resolve_type => |value| resolution.Result.fromBool(try self.resolveGenericTypeHole(module_index, module, o, value)),'
          assert text.count(old) == 1
          text = text.replace(old, '.resolve_type => |value| try self.resolveGenericTypeHole(module_index, module, o, value),', 1)
          start = text.index('    fn resolveGenericTypeHole(')
          end = text.index('\n    pub fn ensureGenericInstance(', start)
          block = text[start:end]
          assert ') !bool {' in block
          block = block.replace(') !bool {', ') !resolution.Result {', 1)
          block = block.replace('const args = reference.generic_arguments orelse return false;', 'const args = reference.generic_arguments orelse return .not_applicable;', 1)
          block = block.replace('catch return false;', 'catch return .deferred;', 1)
          block = block.replace('        return true;', '        return .resolved;', 1)
          text = text[:start] + block + text[end:]
          path.write_text(text)

          assert '.resolve_type => |value| try self.resolveTypeHole' in Path('src/4_semantics/global/core.zig').read_text()
          assert '.resolve_type => |value| try self.resolveGenericTypeHole' in Path('src/4_semantics/global/generics.zig').read_text()
          print('type resolution ownership classified explicitly')
          PY

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install LLVM 21
        run: |
          sudo apt-get update
          sudo apt-get install -y wget ca-certificates gnupg
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get install -y llvm-21-dev clang-21

      - name: Build compiler
        run: zig build

      - name: Run internal tests
        timeout-minutes: 5
        run: zig build test-internal

      - name: Commit validated type states
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/4_semantics/global/core.zig src/4_semantics/global/generics.zig
          git commit -m "Classify type resolution states"
          git push origin HEAD:compact-semantic-graph-chatgpt
