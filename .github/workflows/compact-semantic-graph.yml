name: Trace semantic resolution ownership

on:
  push:
    branches:
      - compact-semantic-graph-chatgpt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply ownership fixes under test
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Ordinary concrete lookup must never claim abstract dispatch contracts.
          path = Path('src/4_semantics/global/core.zig')
          text = path.read_text()
          start = text.index('    pub fn matchFunctionByName(')
          end = text.index('\n    pub fn resolveFunctionByName(', start)
          block = text[start:end]
          needle = '        for (self.graph.functions.items, 0..) |function, raw| {\n            const decl = self.graph.declarations.items[@intFromEnum(function.declaration)];'
          assert needle in block
          block = block.replace(needle, '        for (self.graph.functions.items, 0..) |function, raw| {\n            if (function.flags.is_abstract_dispatch) continue;\n            const decl = self.graph.declarations.items[@intFromEnum(function.declaration)];', 1)
          text = text[:start] + block + text[end:]
          path.write_text(text)

          # Generic lookup must not claim abstract contract parameterized functions.
          path = Path('src/4_semantics/global/generic_functions.zig')
          text = path.read_text()
          needle = '            for (candidate_module.semantic.parameterized_storage.parameterized_functions.items) |parameterized| {\n'
          assert text.count(needle) == 4
          text = text.replace(needle, needle + '                if (parameterized.dispatch_kind == .abstract_contract) continue;\n')
          path.write_text(text)

          # Strict staged routing: deferred stops fallback, only not_applicable falls through.
          def lines(*items): return '\n'.join(items)
          path = Path('src/4_semantics/global/semantizer.zig')
          text = path.read_text()
          anchor = 'const ownership_mod = @import("ownership.zig");\n'
          assert anchor in text
          text = text.replace(anchor, anchor + 'const resolution = @import("resolution.zig");\n', 1)
          start = text.index('fn resolvePendingOperation(')
          end = text.index('\nfn markUnresolvedTypeSlots(', start)
          old = text[start:end]
          type_old = lines('        .resolve_type => blk: {','            if ((try core.tryResolve(module_index, module, o, operation)).isResolved()) break :blk true;','            break :blk (try generics.tryResolve(module_index, module, o, operation)).isResolved();','        },')
          type_new = lines('        .resolve_type => blk: {','            if (terminalResolution(try core.tryResolve(module_index, module, o, operation))) |done| break :blk done;','            if (terminalResolution(try generics.tryResolve(module_index, module, o, operation))) |done| break :blk done;','            break :blk false;','        },')
          call_old = lines('        .resolve_call => blk: {','            if ((try core.tryResolve(module_index, module, o, operation)).isResolved()) break :blk true;','            if ((try generic_functions.tryResolve(module_index, module, o, operation)).isResolved()) break :blk true;','            if ((try constructors.tryResolve(module_index, module, o, operation)).isResolved()) break :blk true;','            if ((try abstracts.tryResolve(module_index, module, o, operation)).isResolved()) break :blk true;','            break :blk (try control.tryResolve(module_index, module, o, operation)).isResolved();','        },')
          call_new = lines('        .resolve_call => |value| blk: {','            const reference = module.semantic.external_refs.items[@intFromEnum(value.callee)];','            const trace = std.mem.eql(u8, module.text(reference.name), "write_byte");','            const core_result = try core.tryResolve(module_index, module, o, operation);','            if (trace) std.debug.print("ROUTE write_byte core={s}\\n", .{@tagName(core_result)});','            if (terminalResolution(core_result)) |done| break :blk done;','            const generic_result = try generic_functions.tryResolve(module_index, module, o, operation);','            if (trace) std.debug.print("ROUTE write_byte generic={s}\\n", .{@tagName(generic_result)});','            if (terminalResolution(generic_result)) |done| break :blk done;','            const constructor_result = try constructors.tryResolve(module_index, module, o, operation);','            if (trace) std.debug.print("ROUTE write_byte constructor={s}\\n", .{@tagName(constructor_result)});','            if (terminalResolution(constructor_result)) |done| break :blk done;','            const abstract_result = try abstracts.tryResolve(module_index, module, o, operation);','            if (trace) std.debug.print("ROUTE write_byte abstract={s}\\n", .{@tagName(abstract_result)});','            if (terminalResolution(abstract_result)) |done| break :blk done;','            const control_result = try control.tryResolve(module_index, module, o, operation);','            if (trace) std.debug.print("ROUTE write_byte control={s}\\n", .{@tagName(control_result)});','            if (terminalResolution(control_result)) |done| break :blk done;','            break :blk false;','        },')
          index_old = lines('        .resolve_index => blk: {','            if ((try core.tryResolve(module_index, module, o, operation)).isResolved()) break :blk true;','            break :blk (try generic_functions.tryResolve(module_index, module, o, operation)).isResolved();','        },')
          index_new = lines('        .resolve_index => blk: {','            if (terminalResolution(try core.tryResolve(module_index, module, o, operation))) |done| break :blk done;','            if (terminalResolution(try generic_functions.tryResolve(module_index, module, o, operation))) |done| break :blk done;','            break :blk false;','        },')
          assert type_old in old and call_old in old and index_old in old
          updated = old.replace(type_old, type_new, 1).replace(call_old, call_new, 1).replace(index_old, index_new, 1)
          text = text[:start] + updated + text[end:]
          helper = lines('','fn terminalResolution(result: resolution.Result) ?bool {','    return switch (result) {','        .resolved => true,','        .deferred => false,','        .not_applicable => null,','    };','}','')
          insert = text.index('\nfn markUnresolvedTypeSlots(', text.index('fn resolvePendingOperation('))
          text = text[:insert] + helper + text[insert:]
          path.write_text(text)
          PY

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install LLVM 21
        run: |
          sudo apt-get update
          sudo apt-get install -y wget ca-certificates gnupg
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get install -y llvm-21-dev clang-21

      - name: Build compiler
        run: zig build

      - name: Trace internal tests
        timeout-minutes: 5
        run: zig build test-internal
