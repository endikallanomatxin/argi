name: Decouple semantic control modes

on:
  push:
    branches:
      - compact-semantic-graph-chatgpt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move durable modes into semantic primitives
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, expected=1):
              p = Path(path)
              s = p.read_text()
              count = s.count(old)
              assert count == expected, f"{path}: expected {expected}, got {count}: {old!r}"
              p.write_text(s.replace(old, new, expected))

          replace('src/4_semantics/primitives/schema.zig', 'const syn = @import("../../3_syntax/syntax_tree.zig");\n', '')
          replace('src/4_semantics/primitives/schema.zig', 'pub const PointerMutability = enum(u8) { read_only, read_write };\n', 'pub const PointerMutability = enum(u8) { read_only, read_write };\npub const Mutability = enum(u8) { constant, variable };\npub const ForMode = enum(u8) { value, borrow, mut_borrow };\npub const MatchCaseMode = enum(u8) { value, borrow, mut_borrow, move };\n')
          replace('src/4_semantics/primitives/schema.zig', 'mutability: syn.Mutability,', 'mutability: Mutability,')

          replace('src/4_semantics/module/entities.zig', 'const syn = @import("../../3_syntax/syntax_tree.zig");\n', '')
          replace('src/4_semantics/module/entities.zig', 'mode: syn.ForMode,', 'mode: primitives.ForMode,')
          replace('src/4_semantics/module/entities.zig', 'mode: syn.MatchCaseMode,', 'mode: primitives.MatchCaseMode,')

          replace('src/4_semantics/module/parameterized/ir.zig', 'const syn = @import("../../../3_syntax/syntax_tree.zig");\n', '')
          replace('src/4_semantics/module/parameterized/ir.zig', 'mode: syn.MatchCaseMode,', 'mode: primitives.MatchCaseMode,')

          p = Path('src/4_semantics/module/graph.zig')
          s = p.read_text()
          marker = 'pub fn pointerMutabilityFromSyntax(value: syn.PointerMutability) primitives.PointerMutability {\n    return switch (value) {\n        .read_only => .read_only,\n        .read_write => .read_write,\n    };\n}\n'
          assert s.count(marker) == 1, s.count(marker)
          extra = '\npub fn mutabilityFromSyntax(value: syn.Mutability) primitives.Mutability {\n    return switch (value) {\n        .constant => .constant,\n        .variable => .variable,\n    };\n}\n\npub fn forModeFromSyntax(value: syn.ForMode) primitives.ForMode {\n    return switch (value) {\n        .value => .value,\n        .borrow => .borrow,\n        .mut_borrow => .mut_borrow,\n    };\n}\n\npub fn matchCaseModeFromSyntax(value: syn.MatchCaseMode) primitives.MatchCaseMode {\n    return switch (value) {\n        .value => .value,\n        .borrow => .borrow,\n        .mut_borrow => .mut_borrow,\n        .move => .move,\n    };\n}\n'
          p.write_text(s.replace(marker, marker + extra, 1))

          replace('src/4_semantics/module/body_lowerer.zig', 'mutability: syn.Mutability,', 'mutability: primitives.Mutability,')
          replace('src/4_semantics/module/body_lowerer.zig', '.mutability = declaration.mutability,', '.mutability = graph_mod.mutabilityFromSyntax(declaration.mutability),')
          replace('src/4_semantics/module/body_lowerer.zig', '.mode = statement.mode,', '.mode = graph_mod.forModeFromSyntax(statement.mode),')
          replace('src/4_semantics/module/body_lowerer.zig', '.mode = case.mode,', '.mode = graph_mod.matchCaseModeFromSyntax(case.mode),')

          replace('src/4_semantics/module/initializer_lowerer.zig', '.mutability = syntax_decl.mutability,', '.mutability = graph_mod.mutabilityFromSyntax(syntax_decl.mutability),')

          replace('src/4_semantics/module/parameterized/lowerer.zig', '.mutability = declaration.mutability,', '.mutability = graph_mod.mutabilityFromSyntax(declaration.mutability),')
          replace('src/4_semantics/module/parameterized/lowerer.zig', '.mode = case.mode,', '.mode = graph_mod.matchCaseModeFromSyntax(case.mode),')

          replace('src/4_semantics/global/control.zig', 'const syn = @import("../../3_syntax/syntax_tree.zig");\n', '')
          replace('src/4_semantics/global/control.zig', 'mode: syn.MatchCaseMode)', 'mode: primitives.MatchCaseMode)')
          replace('src/4_semantics/global/control.zig', 'mode: syn.ForMode)', 'mode: primitives.ForMode)')
          replace('src/4_semantics/global/generic_functions.zig', 'mode: syn.MatchCaseMode)', 'mode: primitives.MatchCaseMode)')

          banned = ('syn.Mutability', 'syn.ForMode', 'syn.MatchCaseMode')
          occurrences = []
          for path in Path('src/4_semantics').rglob('*.zig'):
              for line_no, line in enumerate(path.read_text().splitlines(), 1):
                  if any(item in line for item in banned):
                      occurrences.append((str(path), line_no, line.strip()))
          assert len(occurrences) == 3, occurrences
          assert all(path == 'src/4_semantics/module/graph.zig' for path, _, _ in occurrences), occurrences
          assert all('FromSyntax' in line for _, _, line in occurrences), occurrences
          for path in [Path('src/4_semantics/primitives/schema.zig'), Path('src/4_semantics/module/entities.zig'), Path('src/4_semantics/module/parameterized/ir.zig'), Path('src/4_semantics/global/control.zig')]:
              assert '3_syntax' not in path.read_text(), path
          print('syntax control-mode boundary:', occurrences)
          PY

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install LLVM 21
        run: |
          sudo apt-get update
          sudo apt-get install -y wget ca-certificates gnupg
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get install -y llvm-21-dev clang-21

      - name: Build compiler
        run: zig build

      - name: Run internal tests
        timeout-minutes: 5
        run: zig build test-internal

      - name: Commit validated boundary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/4_semantics/primitives/schema.zig src/4_semantics/module/entities.zig src/4_semantics/module/parameterized/ir.zig src/4_semantics/module/graph.zig src/4_semantics/module/body_lowerer.zig src/4_semantics/module/initializer_lowerer.zig src/4_semantics/module/parameterized/lowerer.zig src/4_semantics/global/control.zig src/4_semantics/global/generic_functions.zig
          git commit -m "Decouple semantic control modes from syntax"
          git push origin HEAD:compact-semantic-graph-chatgpt
