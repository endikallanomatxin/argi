name: Compact semantic graph stabilization probe

on:
  push:
    branches:
      - compact-semantic-graph-chatgpt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply semantic stabilization probes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("src/4_semantics/module/initializer_lowerer.zig")
          s = p.read_text()
          old_calls = '''    try ctx.lowerDeferredStructDefinitions();\n    try ctx.lowerDeferredFunctionInterfaces();'''
          new_calls = '''    try ctx.lowerDeferredStructDefinitions();\n    try ctx.lowerDeferredChoiceDefinitions();\n    try ctx.lowerDeferredFunctionInterfaces();'''
          marker = '''    fn lowerDeferredFunctionInterfaces(self: *Context) !void {'''
          helper = '''    /// Finish non-generic choice declarations whose payload types could not\n    /// be represented by the compatibility builder because they cross a\n    /// module boundary. Canonical ModuleSema can retain those types as\n    /// ExternalRef-backed slots, so the declared choice shape stays complete.\n    fn lowerDeferredChoiceDefinitions(self: *Context) !void {\n        for (self.graph.declarations.items, 0..) |declaration, raw| {\n            if (declaration.kind != .type or declaration.choice_variants != null) continue;\n            self.selectFile(declaration.module_file_index);\n            const type_declaration = self.tree.typeDeclaration(declaration.syntax_node) orelse continue;\n            if (type_declaration.generic_params.len != 0 or type_declaration.generic_params_struct != null) continue;\n            const literal = self.tree.choiceTypeLiteral(type_declaration.value) orelse continue;\n\n            const start: u32 = @intCast(views.variantCount(self.graph));\n            for (literal.variants, 0..) |variant_node, index| {\n                const variant = self.tree.choiceTypeVariant(variant_node) orelse return error.InvalidChoiceVariant;\n                const name_text = self.tree.tokenTextFromSource(self.source, variant.name_token);\n                var option_decl: ?entities.ModuleDeclId = null;\n                if (variant.module_qualifier == null) {\n                    for (self.graph.declarationsNamed(name_text)) |candidate| {\n                        if (self.graph.declarations.items[@intFromEnum(candidate)].kind != .choice_option) continue;\n                        option_decl = candidate;\n                        break;\n                    }\n                }\n                _ = try self.writer.addVariant(.{\n                    .name = try self.writer.addString(name_text),\n                    .payload_type = if (variant.payload_type) |payload| try self.lowerType(payload) else null,\n                    .option_decl = option_decl,\n                    .source = self.sourceRef(variant_node),\n                    .value = @intCast(index),\n                });\n            }\n            self.graph.declarations.items[raw].choice_variants = .{\n                .start = start,\n                .len = @intCast(literal.variants.len),\n            };\n        }\n    }\n\n'''
          assert s.count(old_calls) == 1
          assert s.count(marker) == 1
          p.write_text(s.replace(old_calls, new_calls, 1).replace(marker, helper + marker, 1))

          p = Path("src/4_semantics/global/core.zig")
          s = p.read_text()
          old = '''                const reference = module.semantic.external_refs.items[@intFromEnum(external)];\n                if (reference.kind != .type) continue;\n                // Generic external references need parameterized substitution and are\n                // intentionally claimed by the generic resolver instead.\n                if (reference.generic_arguments != null) continue;\n                const target = self.resolveDeclaration(module_index, reference, &.{ .type, .abstract_type }) catch continue;'''
          new = '''                const reference = module.semantic.external_refs.items[@intFromEnum(external)];\n                if (reference.kind != .type) continue;\n                if (reference.module_path == null and reference.generic_arguments == null) {\n                    const name = module.text(reference.name);\n                    var resolved_builtin: ?primitives.BuiltinType = null;\n                    inline for (@typeInfo(primitives.BuiltinType).@\"enum\".fields) |field| {\n                        if (std.mem.eql(u8, name, field.name)) {\n                            resolved_builtin = @enumFromInt(field.value);\n                            break;\n                        }\n                    }\n                    if (resolved_builtin) |builtin_type| {\n                        self.graph.types.items[@intFromEnum(globalizer.globalType(o, local_id))] = .{ .builtin = builtin_type };\n                        self.stats.external_types += 1;\n                        continue;\n                    }\n                }\n                // Generic external references need parameterized substitution and are\n                // intentionally claimed by the generic resolver instead.\n                if (reference.generic_arguments != null) continue;\n                const target = self.resolveDeclaration(module_index, reference, &.{ .type, .abstract_type }) catch continue;'''
          assert s.count(old) == 1
          p.write_text(s.replace(old, new, 1))

          p = Path("src/4_semantics/global/ownership.zig")
          s = p.read_text()
          old = '''        const nodes = self.graph.node_refs.items[original.nodes.start..][0..original.nodes.len];\n        for (nodes) |node_id| {'''
          new = '''        // Recursive finalization appends cleanup edges to graph.node_refs and\n        // may reallocate it. Keep a stable copy of this block's original node IDs.\n        const nodes = try self.allocator.dupe(global_sg.GlobalNodeId, self.graph.node_refs.items[original.nodes.start..][0..original.nodes.len]);\n        defer self.allocator.free(nodes);\n        for (nodes) |node_id| {'''
          assert s.count(old) == 1
          p.write_text(s.replace(old, new, 1))

          p = Path("src/4_semantics/global/semantizer.zig")
          s = p.read_text()
          old_own = '''    try ownership.finalize();'''
          new_own = '''    ownership.finalize() catch |err| {\n        std.debug.print("GVSTAGE ownership error={s}\\n", .{@errorName(err)});\n        return err;\n    };'''
          old_verify = '''    try global_verify.verifyGlobal(&relocation.graph);'''
          new_verify = '''    global_verify.verifyGlobal(&relocation.graph) catch |err| {\n        std.debug.print("GVSTAGE verify error={s}\\n", .{@errorName(err)});\n        return err;\n    };'''
          assert s.count(old_own) == 1
          assert s.count(old_verify) == 1
          p.write_text(s.replace(old_own, new_own, 1).replace(old_verify, new_verify, 1))

          p = Path("src/4_semantics/global/verify.zig")
          s = p.read_text()
          replacements = {
              '    for (graph.declarations.items) |declaration| try payload.declaration(graph_mod.Ids, declaration, bounds);': '''    for (graph.declarations.items, 0..) |declaration, index| {\n        payload.declaration(graph_mod.Ids, declaration, bounds) catch |err| { std.debug.print("GVFAIL declaration {d}\\n", .{index}); return err; };\n    }''',
              '    for (graph.fields.items) |value| try payload.field(graph_mod.Ids, value, bounds);': '''    for (graph.fields.items, 0..) |value, index| { payload.field(graph_mod.Ids, value, bounds) catch |err| { std.debug.print("GVFAIL field {d}\\n", .{index}); return err; }; }''',
              '    for (graph.variants.items) |value| try payload.variant(graph_mod.Ids, value, bounds);': '''    for (graph.variants.items, 0..) |value, index| { payload.variant(graph_mod.Ids, value, bounds) catch |err| { std.debug.print("GVFAIL variant {d}\\n", .{index}); return err; }; }''',
              '    for (graph.generic_arguments.items) |value| try payload.genericArgument(graph_mod.Ids, value, bounds);': '''    for (graph.generic_arguments.items, 0..) |value, index| { payload.genericArgument(graph_mod.Ids, value, bounds) catch |err| { std.debug.print("GVFAIL generic_argument {d}\\n", .{index}); return err; }; }''',
              '    for (graph.functions.items) |value| try payload.function(graph_mod.Ids, value, bounds);': '''    for (graph.functions.items, 0..) |value, index| { payload.function(graph_mod.Ids, value, bounds) catch |err| { std.debug.print("GVFAIL function {d}\\n", .{index}); return err; }; }''',
              '    for (graph.bindings.items) |value| try payload.binding(graph_mod.Ids, value, bounds);': '''    for (graph.bindings.items, 0..) |value, index| { payload.binding(graph_mod.Ids, value, bounds) catch |err| { std.debug.print("GVFAIL binding {d}\\n", .{index}); return err; }; }''',
              '    for (graph.blocks.items) |value| try payload.block(graph_mod.Ids, value, bounds);': '''    for (graph.blocks.items, 0..) |value, index| { payload.block(graph_mod.Ids, value, bounds) catch |err| { std.debug.print("GVFAIL block {d} start={d} len={d} node_refs={d}\\n", .{ index, value.nodes.start, value.nodes.len, bounds.node_refs }); return err; }; }''',
              '    for (graph.value_fields.items) |value| try payload.valueField(graph_mod.Ids, value, bounds);': '''    for (graph.value_fields.items, 0..) |value, index| { payload.valueField(graph_mod.Ids, value, bounds) catch |err| { std.debug.print("GVFAIL value_field {d}\\n", .{index}); return err; }; }''',
              '    for (graph.switch_cases.items) |value| try payload.switchCase(graph_mod.Ids, value, bounds);': '''    for (graph.switch_cases.items, 0..) |value, index| { payload.switchCase(graph_mod.Ids, value, bounds) catch |err| { std.debug.print("GVFAIL switch_case {d}\\n", .{index}); return err; }; }''',
              '    for (graph.switches.items) |value| try payload.switchPayload(graph_mod.Ids, value, bounds);': '''    for (graph.switches.items, 0..) |value, index| { payload.switchPayload(graph_mod.Ids, value, bounds) catch |err| { std.debug.print("GVFAIL switch {d}\\n", .{index}); return err; }; }''',
              '    for (graph.auto_deinit_fields.items) |value| try payload.autoDeinitField(graph_mod.Ids, value, bounds);': '''    for (graph.auto_deinit_fields.items, 0..) |value, index| { payload.autoDeinitField(graph_mod.Ids, value, bounds) catch |err| { std.debug.print("GVFAIL auto_deinit_field {d}\\n", .{index}); return err; }; }''',
              '    for (graph.auto_deinits.items) |value| try payload.autoDeinit(graph_mod.Ids, value, bounds);': '''    for (graph.auto_deinits.items, 0..) |value, index| { payload.autoDeinit(graph_mod.Ids, value, bounds) catch |err| { std.debug.print("GVFAIL auto_deinit {d}\\n", .{index}); return err; }; }''',
              '    for (graph.nodes.items) |value| try payload.node(graph_mod.Ids, value, bounds);': '''    for (graph.nodes.items, 0..) |value, index| { payload.node(graph_mod.Ids, value, bounds) catch |err| { std.debug.print("GVFAIL node {d} tag={s} source_file={d} off={d}\\n", .{ index, @tagName(value.content), value.source.file_index, value.source.offset }); return err; }; }''',
          }
          for old, new in replacements.items():
              assert s.count(old) == 1, old
              s = s.replace(old, new, 1)
          old_types = '''    for (graph.types.items) |value| {\n        try payload.semanticType(graph_mod.Ids, value, bounds);'''
          new_types = '''    for (graph.types.items, 0..) |value, index| {\n        payload.semanticType(graph_mod.Ids, value, bounds) catch |err| { std.debug.print("GVFAIL type {d} tag={s}\\n", .{ index, @tagName(value) }); return err; };'''
          assert s.count(old_types) == 1
          s = s.replace(old_types, new_types, 1)
          p.write_text(s)
          PY

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install LLVM 21
        run: |
          sudo apt-get update
          sudo apt-get install -y wget ca-certificates gnupg
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get install -y llvm-21-dev clang-21

      - name: Build compiler
        run: zig build

      - name: Run internal tests
        timeout-minutes: 5
        run: zig build test-internal
