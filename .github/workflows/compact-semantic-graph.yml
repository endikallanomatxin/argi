name: Compact semantic graph

on:
  push:
    branches:
      - compact-semantic-graph-chatgpt
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install LLVM
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-18-dev clang-18
          zig version
          llvm-config-18 --version

      - name: Run test suite
        run: zig build test
