name: Type and index resolution ownership

on:
  push:
    branches:
      - compact-semantic-graph-chatgpt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify type and index ownership
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Core: non-generic type holes belong here; generic ones fall through.
          path = Path('src/4_semantics/global/core.zig')
          text = path.read_text()
          text = text.replace(
              '.resolve_type => |value| resolution.Result.fromBool(try self.resolveTypeHole(module_index, module, o, value)),',
              '.resolve_type => |value| try self.resolveTypeHole(module_index, module, o, value),',
              1,
          )
          text = text.replace(
              '.resolve_index => |value| resolution.Result.fromBool(try self.resolveIndex(module_index, o, value)),',
              '.resolve_index => |value| try self.resolveIndex(module_index, o, value),',
              1,
          )

          start = text.index('    fn resolveTypeHole(')
          end = text.index('\n    fn resolveCall(', start)
          block = text[start:end]
          assert ') !bool {' in block
          block = block.replace(') !bool {', ') !resolution.Result {', 1)
          block = block.replace('if (reference.generic_arguments != null) return false;', 'if (reference.generic_arguments != null) return .not_applicable;', 1)
          block = block.replace('catch return false;', 'catch return .deferred;', 1)
          block = block.replace('        return true;', '        return .resolved;', 1)
          text = text[:start] + block + text[end:]

          start = text.index('    fn resolveIndex(')
          end = text.index('\n    pub const CallInputMatch', start)
          block = text[start:end]
          assert ') !bool {' in block
          block = block.replace(') !bool {', ') !resolution.Result {', 1)
          block = block.replace('const collection_ty = self.graph.nodes.items[@intFromEnum(collection)].ty orelse return false;', 'const collection_ty = self.graph.nodes.items[@intFromEnum(collection)].ty orelse return .deferred;', 1)
          block = block.replace('            return true;', '            return .resolved;', 1)
          block = block.replace('operand_types[i] = self.graph.nodes.items[@intFromEnum(node)].ty orelse return false;', 'operand_types[i] = self.graph.nodes.items[@intFromEnum(node)].ty orelse return .deferred;', 1)
          old_function = '        const function = self.resolveOperator(module_index, operator, operand_types[0..count]) catch return false;'
          assert old_function in block
          new_function = '''        const function = self.resolveOperator(module_index, operator, operand_types[0..count]) catch {
            if (self.graph.types.items[@intFromEnum(collection_ty)] == .generic) return .not_applicable;
            return .deferred;
        };'''
          block = block.replace(old_function, new_function, 1)
          block = block.replace('        return true;\n', '        return .resolved;\n', 1)
          text = text[:start] + block + text[end:]
          path.write_text(text)

          # Generic types: only references with generic arguments belong here.
          path = Path('src/4_semantics/global/generics.zig')
          text = path.read_text()
          text = text.replace(
              '.resolve_type => |value| resolution.Result.fromBool(try self.resolveGenericTypeHole(module_index, module, o, value)),',
              '.resolve_type => |value| try self.resolveGenericTypeHole(module_index, module, o, value),',
              1,
          )
          start = text.index('    fn resolveGenericTypeHole(')
          end = text.index('\n    pub fn ensureGenericInstance(', start)
          block = text[start:end]
          assert ') !bool {' in block
          block = block.replace(') !bool {', ') !resolution.Result {', 1)
          block = block.replace('const args = reference.generic_arguments orelse return false;', 'const args = reference.generic_arguments orelse return .not_applicable;', 1)
          block = block.replace('catch return false;', 'catch return .deferred;', 1)
          block = block.replace('        return true;', '        return .resolved;', 1)
          text = text[:start] + block + text[end:]
          path.write_text(text)

          # Generic indexing: missing collection type is pending; a non-generic
          # collection is outside this resolver's domain.
          path = Path('src/4_semantics/global/generic_functions.zig')
          text = path.read_text()
          text = text.replace(
              '.resolve_index => |value| resolution.Result.fromBool(try self.resolveGenericIndex(module_index, o, value)),',
              '.resolve_index => |value| try self.resolveGenericIndex(module_index, o, value),',
              1,
          )
          start = text.index('    fn resolveGenericIndex(')
          end = text.index('\n    fn parameterizedIndexesBase(', start)
          block = text[start:end]
          assert ') !bool {' in block
          block = block.replace(') !bool {', ') !resolution.Result {', 1)
          block = block.replace('const collection_ty = self.graph.nodes.items[@intFromEnum(collection)].ty orelse return false;', 'const collection_ty = self.graph.nodes.items[@intFromEnum(collection)].ty orelse return .deferred;', 1)
          block = block.replace('            else => return false,', '            else => return .not_applicable,', 1)
          block = block.replace('operand_types[i] = self.graph.nodes.items[@intFromEnum(node)].ty orelse return false;', 'operand_types[i] = self.graph.nodes.items[@intFromEnum(node)].ty orelse return .deferred;', 1)
          block = block.replace('if (addressed_function != null) return false;', 'if (addressed_function != null) return .deferred;', 1)
          block = block.replace('function = addressed_function orelse return false;', 'function = addressed_function orelse return .deferred;', 1)
          block = block.replace('        return true;', '        return .resolved;', 1)
          text = text[:start] + block + text[end:]
          path.write_text(text)

          # Guards: the staged operations no longer use bool adapters.
          core = Path('src/4_semantics/global/core.zig').read_text()
          gen = Path('src/4_semantics/global/generics.zig').read_text()
          gf = Path('src/4_semantics/global/generic_functions.zig').read_text()
          assert '.resolve_type => |value| try self.resolveTypeHole' in core
          assert '.resolve_index => |value| try self.resolveIndex' in core
          assert '.resolve_type => |value| try self.resolveGenericTypeHole' in gen
          assert '.resolve_index => |value| try self.resolveGenericIndex' in gf
          print('type and index ownership classified explicitly')
          PY

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install LLVM 21
        run: |
          sudo apt-get update
          sudo apt-get install -y wget ca-certificates gnupg
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get install -y llvm-21-dev clang-21

      - name: Build compiler
        run: zig build

      - name: Run internal tests
        timeout-minutes: 5
        run: zig build test-internal

      - name: Commit validated resolution ownership
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/4_semantics/global/core.zig src/4_semantics/global/generics.zig src/4_semantics/global/generic_functions.zig
          git commit -m "Classify type and index resolution states"
          git push origin HEAD:compact-semantic-graph-chatgpt
