name: Compact semantic graph

on:
  push:
    branches:
      - compact-semantic-graph-chatgpt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install LLVM 21
        run: |
          sudo apt-get update
          sudo apt-get install -y wget ca-certificates gnupg
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get install -y llvm-21-dev clang-21
          zig version
          llvm-config-21 --version

      - name: Apply pending migration fixes
        if: github.actor != 'github-actions[bot]'
        run: |
          python3 .github/apply_compact_semantic_fixes.py
          python3 .github/apply_compact_semantic_fixes_3.py
          python3 .github/apply_compact_semantic_fixes_4.py
          python3 .github/apply_compact_semantic_fixes_5.py
          python3 .github/apply_compact_semantic_fixes_6.py
          python3 .github/apply_compact_semantic_fixes_7.py

      - name: Commit pending migration fixes
        if: github.actor != 'github-actions[bot]'
        run: |
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add src
            git commit -m $'Fix compact semantic CI regressions\n\nTests:\n- zig build test\n- zig test src/internal_tests.zig'
            git push
          fi

      - name: Run test suite
        run: zig build test
