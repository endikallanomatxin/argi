name: Compact semantic graph

on:
  push:
    branches:
      - compact-semantic-graph-chatgpt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore lost semicolon
        run: |
          python3 -c 'from pathlib import Path; p=Path("src/4_semantics/global/generic_functions.zig"); s=p.read_text(); old="if (input_literal) |literal| if (literal.fields.len == 0) {\n                if (try self.resolveEmptyTypeInitializer(name, source)) |node| return node;\n            }\n            const reference"; new="if (input_literal) |literal| if (literal.fields.len == 0) {\n                if (try self.resolveEmptyTypeInitializer(name, source)) |node| return node;\n            };\n            const reference"; assert s.count(old)==1, s.count(old); p.write_text(s.replace(old,new,1))'
          git config user.name "Endika Llano Matxin"
          git config user.email "119845498+endikallanomatxin@users.noreply.github.com"
          git add src/4_semantics/global/generic_functions.zig
          git commit -m "Restore generic call initializer terminator" -m "Tests: CI"
          git push origin HEAD:compact-semantic-graph-chatgpt

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install LLVM 21
        run: |
          sudo apt-get update
          sudo apt-get install -y wget ca-certificates gnupg
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get install -y llvm-21-dev clang-21
          zig version
          llvm-config-21 --version

      - name: Build compiler
        run: zig build

      - name: Run internal tests
        timeout-minutes: 5
        run: zig build test-internal

      - name: Run program suite
        timeout-minutes: 15
        run: zig build test-programs
