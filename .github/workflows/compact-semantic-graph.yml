name: Abstract call resolution ownership

on:
  push:
    branches:
      - compact-semantic-graph-chatgpt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify abstract call ownership
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/4_semantics/global/abstracts.zig')
          text = path.read_text()

          old = '.resolve_call => |value| resolution.Result.fromBool(try self.resolveVirtualCall(module_index, module, o, value)),'
          assert text.count(old) == 1
          text = text.replace(old, '.resolve_call => |value| try self.resolveVirtualCall(module_index, module, o, value),', 1)

          start = text.index('    fn resolveVirtualCall(')
          end = text.index('\n    fn makeVirtualize(', start)
          block = text[start:end]
          assert ') !bool {' in block
          block = block.replace(') !bool {', ') !resolution.Result {', 1)
          block = block.replace(') orelse return false;', ') orelse return .deferred;', 1)
          block = block.replace('            return true;', '            return .resolved;', 1)
          marker = '        const node = (try self.makeVirtualCall(\n'
          assert marker in block
          block = block.replace(marker, '        if (!self.ownsVirtualCall(module_index, module, reference, input)) return .not_applicable;\n' + marker, 1)
          block = block.replace('        )) orelse return false;', '        )) orelse return .deferred;', 1)
          block = block.replace('        return true;\n', '        return .resolved;\n', 1)
          assert 'return false' not in block
          text = text[:start] + block + text[end:]

          helper = '''\n    fn ownsVirtualCall(\n        self: *const Resolver,\n        module_index: usize,\n        module: *const module_sg.ModuleSemanticGraph,\n        reference: module_entities.ExternalRef,\n        input: global_sg.GlobalNodeId,\n    ) bool {\n        if (reference.module_path != null or reference.generic_arguments != null) return false;\n        const literal = switch (self.graph.nodes.items[@intFromEnum(input)].content) {\n            .struct_value_literal => |item| item,\n            else => return false,\n        };\n        const method_name = module.text(reference.name);\n        for (self.graph.value_fields.items[literal.fields.start..][0..literal.fields.len]) |actual| {\n            const actual_ty = self.graph.nodes.items[@intFromEnum(actual.value)].ty orelse continue;\n            const pointee = switch (self.graph.types.items[@intFromEnum(actual_ty)]) {\n                .pointer => |pointer| pointer.child,\n                else => continue,\n            };\n            const abstract_ty = switch (self.graph.types.items[@intFromEnum(pointee)]) {\n                .virtual => |abstract_type| abstract_type,\n                else => pointee,\n            };\n            const abstract_decl = switch (self.graph.types.items[@intFromEnum(abstract_ty)]) {\n                .declared => |declaration| declaration,\n                else => continue,\n            };\n            const located = self.findAbstractDefinition(abstract_decl) orelse continue;\n            if (located.definition.parameters.len != 0) continue;\n            const storage = &self.modules[located.module_index].semantic.parameterized_storage;\n            for (storage.abstract_requirements.items[located.definition.requirements.start..][0..located.definition.requirements.len]) |requirement| {\n                if (std.mem.eql(u8, self.modules[located.module_index].text(requirement.name), method_name)) return true;\n            }\n        }\n        _ = module_index;\n        return false;\n    }\n'''
          insert_at = text.index('\n    fn makeVirtualize(', text.index('    fn resolveVirtualCall('))
          text = text[:insert_at] + helper + text[insert_at:]

          path.write_text(text)
          updated = path.read_text()
          assert '.resolve_call => |value| try self.resolveVirtualCall' in updated
          assert 'if (!self.ownsVirtualCall(module_index, module, reference, input)) return .not_applicable;' in updated
          assert 'fn ownsVirtualCall(' in updated
          print('abstract call ownership classified explicitly')
          PY

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install LLVM 21
        run: |
          sudo apt-get update
          sudo apt-get install -y wget ca-certificates gnupg
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get install -y llvm-21-dev clang-21

      - name: Build compiler
        run: zig build

      - name: Run internal tests
        timeout-minutes: 5
        run: zig build test-internal

      - name: Commit validated abstract call states
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/4_semantics/global/abstracts.zig
          git commit -m "Classify abstract call resolution states"
          git push origin HEAD:compact-semantic-graph-chatgpt
