name: Generic call resolution ownership

on:
  push:
    branches:
      - compact-semantic-graph-chatgpt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify generic call ownership
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/4_semantics/global/generic_functions.zig')
          text = path.read_text()

          old = '.resolve_call => |value| resolution.Result.fromBool(try self.resolveModuleGenericCall(module_index, module, o, value)),'
          assert text.count(old) == 1
          text = text.replace(old, '.resolve_call => |value| try self.resolveModuleGenericCall(module_index, module, o, value),', 1)

          start = text.index('    fn resolveModuleGenericCall(')
          end = text.index('\n    fn resolveExplicitGenericFunction(', start)
          block = text[start:end]
          assert ') !bool {' in block
          block = block.replace(') !bool {', ') !resolution.Result {', 1)
          block = block.replace(') orelse return false;', ') orelse return .deferred;', 2)
          block = block.replace('            return true;', '            return .resolved;', 2)
          marker = '        const function = if (local_args) |args|\n'
          assert marker in block
          block = block.replace(marker, '        if (!try self.hasVisibleGenericCandidate(module_index, module, reference)) return .not_applicable;\n' + marker, 1)
          block = block.replace(' catch return false;', ' catch return .deferred;', 2)
          block = block.replace('if (!try self.core.completeCallInputFields(self.graph.functions.items[@intFromEnum(function)].input, input)) return false;', 'if (!try self.core.completeCallInputFields(self.graph.functions.items[@intFromEnum(function)].input, input)) return .deferred;', 1)
          block = block.replace('        return true;\n', '        return .resolved;\n', 1)
          text = text[:start] + block + text[end:]

          helper = '''\n    fn hasVisibleGenericCandidate(\n        self: *Resolver,\n        current_module: usize,\n        module: *const module_sg.ModuleSemanticGraph,\n        reference: module_entities.ExternalRef,\n    ) !bool {\n        const module_filter = if (reference.module_path) |path|\n            try self.core.findModuleForQualifier(current_module, module.text(path))\n        else\n            null;\n        const name = module.text(reference.name);\n        for (self.modules, 0..) |*candidate_module, candidate_index| {\n            for (candidate_module.semantic.parameterized_storage.parameterized_functions.items) |parameterized| {\n                const declaration = globalizer.globalDecl(self.offsets[candidate_index], parameterized.declaration);\n                const decl = self.graph.declarations.items[@intFromEnum(declaration)];\n                if (!std.mem.eql(u8, self.graph.text(decl.name), name)) continue;\n                if (!self.core.declarationVisible(current_module, declaration, module_filter)) continue;\n                return true;\n            }\n        }\n        return false;\n    }\n'''
          insert_at = text.index('\n    fn resolveExplicitGenericFunction(', text.index('    fn resolveModuleGenericCall('))
          text = text[:insert_at] + helper + text[insert_at:]

          path.write_text(text)
          updated = path.read_text()
          assert 'if (!try self.hasVisibleGenericCandidate(module_index, module, reference)) return .not_applicable;' in updated
          assert 'fn hasVisibleGenericCandidate(' in updated
          assert '.resolve_call => |value| try self.resolveModuleGenericCall' in updated
          print('generic call ownership classified explicitly')
          PY

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install LLVM 21
        run: |
          sudo apt-get update
          sudo apt-get install -y wget ca-certificates gnupg
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get install -y llvm-21-dev clang-21

      - name: Build compiler
        run: zig build

      - name: Run internal tests
        timeout-minutes: 5
        run: zig build test-internal

      - name: Commit validated generic call states
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/4_semantics/global/generic_functions.zig
          git commit -m "Classify generic call resolution states"
          git push origin HEAD:compact-semantic-graph-chatgpt
