name: Compact semantic graph

on:
  push:
    branches:
      - compact-semantic-graph-chatgpt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install LLVM 21
        run: |
          sudo apt-get update
          sudo apt-get install -y wget ca-certificates gnupg
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get install -y llvm-21-dev clang-21
          zig version
          llvm-config-21 --version

      - name: Trace generic deinit resolution
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src/4_semantics/global/generic_functions.zig")
          text = path.read_text()
          old = '''        else
            self.resolveImplicitGenericFunction(module_index, module, reference, input) catch return false;'''
          new = '''        else
            self.resolveImplicitGenericFunction(module_index, module, reference, input) catch |err| {
                if (std.mem.eql(u8, name, "deinit"))
                    std.debug.print("generic deinit resolution failed: {s}\\n", .{@errorName(err)});
                return false;
            };'''
          assert old in text
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Build compiler
        run: zig build

      - name: Run internal tests
        timeout-minutes: 5
        run: zig build test-internal

      - name: Run program suite
        timeout-minutes: 15
        run: zig build test-programs
