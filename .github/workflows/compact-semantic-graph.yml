name: Remove TypeReference syntax-node provenance

on:
  push:
    branches:
      - compact-semantic-graph-chatgpt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply TypeReference cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/4_semantics/module/graph.zig')
          s = p.read_text()

          s, n = re.subn(
              r'(pub const TypeReference = struct \{\n(?:.*\n)*?    source_offset: u32,\n)    syntax_node: syn\.NodeIndex,\n',
              r'\1',
              s,
              count=1,
          )
          assert n == 1, f'TypeReference field removal matched {n}'

          old = 'const reference = findTypeReference(graph, module_file_index, node) orelse break :blk null;'
          new = 'const reference = findTypeReference(graph, module_file_index, tree.tokenLocation(name.name_token).offset) orelse break :blk null;'
          assert s.count(old) == 1
          s = s.replace(old, new, 1)

          old = 'const reference = findTypeReference(graph, module_file_index, generic.base) orelse return null;'
          new = 'const reference = findTypeReference(graph, module_file_index, tree.tokenLocation(base.name.name_token).offset) orelse return null;'
          assert s.count(old) == 1
          s = s.replace(old, new, 1)

          old = 'fn findTypeReference(graph: *const ModuleSemanticGraph, module_file_index: u32, node: syn.NodeIndex) ?TypeReference {'
          new = 'fn findTypeReference(graph: *const ModuleSemanticGraph, module_file_index: u32, source_offset: u32) ?TypeReference {'
          assert s.count(old) == 1
          s = s.replace(old, new, 1)
          old = 'if (reference.syntax_node == node) return reference;'
          new = 'if (reference.source_offset == source_offset) return reference;'
          assert s.count(old) == 1
          s = s.replace(old, new, 1)

          marker = 'try graph.type_references.append(allocator, .{'
          start = s.index(marker)
          end = s.index('        });', start) + len('        });')
          block = s[start:end]
          assert block.count('.syntax_node = node,') == 1
          block = block.replace('            .syntax_node = node,\n', '', 1)
          s = s[:start] + block + s[end:]

          p.write_text(s)
          PY
          git checkout HEAD -- .github/workflows/compact-semantic-graph.yml

      - name: Ensure TypeReference is syntax-independent
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('src/4_semantics/module/graph.zig').read_text()
          block = s[s.index('pub const TypeReference = struct'):s.index('pub const TypeReferenceResolution')]
          assert 'syntax_node' not in block
          assert 'reference.syntax_node' not in s
          PY

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install LLVM 21
        run: |
          sudo apt-get update
          sudo apt-get install -y wget ca-certificates gnupg
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get install -y llvm-21-dev clang-21

      - name: Build compiler
        run: zig build

      - name: Run internal tests
        timeout-minutes: 5
        run: zig build test-internal

      - name: Commit validated cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/4_semantics/module/graph.zig
          git commit -m "Remove TypeReference syntax-node provenance"
          git push origin HEAD:compact-semantic-graph-chatgpt
