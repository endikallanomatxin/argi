name: Materialize generic routing fix

on:
  push:
    branches:
      - compact-semantic-graph-chatgpt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-once:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply signature-aware generic ownership
        run: |
          python3 - <<'PY'
          from pathlib import Path

          generic_path = Path('src/4_semantics/global/generic_functions.zig')
          generic_text = generic_path.read_text()
          if 'error.DeferredGenericFunction' in generic_text and 'fn matchParameterizedInput(' in generic_text:
              print('signature-aware generic ownership already materialized')
              raise SystemExit(0)

          # Ordinary concrete lookup must not consume abstract dispatch contracts.
          path = Path('src/4_semantics/global/core.zig')
          text = path.read_text()
          start = text.index('    pub fn matchFunctionByName(')
          end = text.index('\n    pub fn resolveFunctionByName(', start)
          block = text[start:end]
          needle = '        for (self.graph.functions.items, 0..) |function, raw| {\n            const decl = self.graph.declarations.items[@intFromEnum(function.declaration)];'
          assert needle in block
          block = block.replace(needle, '        for (self.graph.functions.items, 0..) |function, raw| {\n            if (function.flags.is_abstract_dispatch) continue;\n            const decl = self.graph.declarations.items[@intFromEnum(function.declaration)];', 1)
          text = text[:start] + block + text[end:]
          path.write_text(text)

          path = generic_path
          text = path.read_text()

          # Abstract requirements are owned exclusively by the abstract resolver.
          loop = '            for (candidate_module.semantic.parameterized_storage.parameterized_functions.items) |parameterized| {\n'
          assert text.count(loop) == 4
          text = text.replace(loop, loop + '                if (parameterized.dispatch_kind == .abstract_contract) continue;\n')

          # Name visibility alone is not ownership. Signature selection decides
          # whether the generic subsystem owns, defers, or rejects the call.
          visible_check = '        if (!try self.hasVisibleGenericCandidate(module_index, module, reference)) return .not_applicable;\n'
          assert text.count(visible_check) == 1
          text = text.replace(visible_check, '', 1)
          helper_start = text.index('    fn hasVisibleGenericCandidate(')
          helper_end = text.index('\n    fn resolveExplicitGenericFunction(', helper_start)
          text = text[:helper_start] + text[helper_end + 1:]

          old_dispatch = '''        const function = if (local_args) |args|
            self.resolveExplicitGenericFunction(module_index, module, reference, try self.generics.relocateModuleArguments(module_index, args), input) catch return .deferred
        else
            self.resolveImplicitGenericFunction(module_index, module, reference, input) catch return .deferred;'''
          new_dispatch = '''        const function = if (local_args) |args|
            self.resolveExplicitGenericFunction(module_index, module, reference, try self.generics.relocateModuleArguments(module_index, args), input) catch |err| switch (err) {
                error.NoMatchingGenericFunction => return .not_applicable,
                error.DeferredGenericFunction => return .deferred,
                error.AmbiguousGenericFunction => return err,
                else => return .deferred,
            }
        else
            self.resolveImplicitGenericFunction(module_index, module, reference, input) catch |err| switch (err) {
                error.NoMatchingGenericFunction => return .not_applicable,
                error.DeferredGenericFunction => return .deferred,
                error.AmbiguousGenericFunction => return err,
                else => return .deferred,
            };'''
          assert old_dispatch in text
          text = text.replace(old_dispatch, new_dispatch, 1)

          # Explicit generic overload selection preserves pending signature state.
          start = text.index('    fn resolveExplicitGenericFunction(')
          end = text.index('\n    fn resolveImplicitGenericFunction(', start)
          block = text[start:end]
          assert block.count('var tied = false;') == 1
          block = block.replace('        var tied = false;\n', '        var tied = false;\n        var saw_deferred = false;\n', 1)
          old_score = '''                const score = self.scoreParameterizedInput(candidate_index, parameterized.input, &bindings, input) orelse continue;
                if (best == null or score > best_score) {
                    best = declaration;
                    best_score = score;
                    tied = false;
                } else if (score == best_score and declaration != best.?) tied = true;'''
          new_score = '''                const score = switch (self.matchParameterizedInput(candidate_index, parameterized.input, &bindings, input)) {
                    .no_match => continue,
                    .deferred => {
                        saw_deferred = true;
                        continue;
                    },
                    .score => |score| score,
                };
                if (best == null or score > best_score) {
                    best = declaration;
                    best_score = score;
                    tied = false;
                } else if (score == best_score and declaration != best.?) tied = true;'''
          assert old_score in block
          block = block.replace(old_score, new_score, 1)
          old_tail = '''        if (tied) return error.AmbiguousGenericFunction;
        return self.instantiate(best orelse return error.NoMatchingGenericFunction, arguments);'''
          new_tail = '''        if (tied) return error.AmbiguousGenericFunction;
        const declaration = best orelse return if (saw_deferred) error.DeferredGenericFunction else error.NoMatchingGenericFunction;
        return self.instantiate(declaration, arguments);'''
          assert old_tail in block
          block = block.replace(old_tail, new_tail, 1)
          text = text[:start] + block + text[end:]

          # Implicit inference distinguishes unknown actual type from true mismatch.
          start = text.index('    fn resolveImplicitGenericFunction(')
          end = text.index('\n    fn scoreParameterizedInput(', start)
          block = text[start:end]
          assert block.count('var tied = false;') == 1
          block = block.replace('        var tied = false;\n', '        var tied = false;\n        var saw_deferred = false;\n', 1)
          assert block.count('                var matches = true;') == 1
          block = block.replace('                var matches = true;\n', '                var matches = true;\n                var candidate_deferred = false;\n', 1)
          old_actual = '''                        const actual = self.graph.nodes.items[@intFromEnum(value.value)].ty orelse {
                            matches = false;
                            break;
                        };
                        if (!try self.inferInputType(candidate_index, field.ty, actual, &bindings)) matches = false;'''
          new_actual = '''                        const actual = self.graph.nodes.items[@intFromEnum(value.value)].ty orelse {
                            candidate_deferred = true;
                            matches = false;
                            break;
                        };
                        const inferred = self.inferInputType(candidate_index, field.ty, actual, &bindings) catch {
                            candidate_deferred = true;
                            matches = false;
                            break;
                        };
                        if (!inferred) matches = false;'''
          assert old_actual in block
          block = block.replace(old_actual, new_actual, 1)
          assert block.count('                if (!matches) continue;') == 1
          block = block.replace('                if (!matches) continue;\n', '                if (!matches) {\n                    if (candidate_deferred) saw_deferred = true;\n                    continue;\n                }\n', 1)
          old_implicit_score = '                const score = self.scoreParameterizedInput(candidate_index, parameterized.input, &bindings, input) orelse continue;'
          new_implicit_score = '''                const score = switch (self.matchParameterizedInput(candidate_index, parameterized.input, &bindings, input)) {
                    .no_match => continue,
                    .deferred => {
                        saw_deferred = true;
                        continue;
                    },
                    .score => |score| score,
                };'''
          assert old_implicit_score in block
          block = block.replace(old_implicit_score, new_implicit_score, 1)
          implicit_old_tail = old_tail.replace('arguments', 'best_arguments')
          assert implicit_old_tail in block
          block = block.replace(implicit_old_tail, '''        if (tied) return error.AmbiguousGenericFunction;
        const declaration = best orelse return if (saw_deferred) error.DeferredGenericFunction else error.NoMatchingGenericFunction;
        return self.instantiate(declaration, best_arguments);''', 1)
          text = text[:start] + block + text[end:]

          # Signature probing uses the same tri-state matcher as concrete calls.
          start = text.index('    fn scoreParameterizedInput(')
          end = text.index('\n    // Infer from named input fields', start)
          block = text[start:end]
          block = block.replace('    fn scoreParameterizedInput(', '    fn matchParameterizedInput(', 1)
          block = block.replace(') ?u32 {', ') core_mod.Resolver.CallInputMatch {', 1)
          block = block.replace('catch return null;', 'catch return .deferred;')
          block = block.replace('        return self.core.scoreCallInput(fields, input);', '        return self.core.matchCallInput(fields, input);', 1)
          text = text[:start] + block + text[end:]

          path.write_text(text)
          final = path.read_text()
          assert 'fn hasVisibleGenericCandidate(' not in final
          assert 'fn scoreParameterizedInput(' not in final
          assert 'fn matchParameterizedInput(' in final
          assert 'error.DeferredGenericFunction' in final
          assert final.count('if (parameterized.dispatch_kind == .abstract_contract) continue;') == 4
          print('generic call ownership is now signature-aware')
          PY

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install LLVM 21
        run: |
          sudo apt-get update
          sudo apt-get install -y wget ca-certificates gnupg
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get install -y llvm-21-dev clang-21

      - name: Build compiler
        run: zig build

      - name: Run internal tests
        timeout-minutes: 5
        run: zig build test-internal

      - name: Commit materialized fix
        if: success()
        run: |
          if git diff --quiet -- src/4_semantics/global/core.zig src/4_semantics/global/generic_functions.zig; then
            echo "No source changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/4_semantics/global/core.zig src/4_semantics/global/generic_functions.zig
          git commit -m "Make generic resolution ownership signature-aware"
          git push origin HEAD:compact-semantic-graph-chatgpt
