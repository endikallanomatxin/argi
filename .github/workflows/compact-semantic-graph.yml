name: Enforce semantic resolution ownership

on:
  push:
    branches:
      - compact-semantic-graph-chatgpt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stop fallback on deferred resolution
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def lines(*items):
              return '\n'.join(items)

          path = Path('src/4_semantics/global/semantizer.zig')
          text = path.read_text()
          anchor = 'const ownership_mod = @import("ownership.zig");\n'
          assert anchor in text
          text = text.replace(anchor, anchor + 'const resolution = @import("resolution.zig");\n', 1)

          start = text.index('fn resolvePendingOperation(')
          end = text.index('\nfn markUnresolvedTypeSlots(', start)
          old = text[start:end]

          type_old = lines(
              '        .resolve_type => blk: {',
              '            if ((try core.tryResolve(module_index, module, o, operation)).isResolved()) break :blk true;',
              '            break :blk (try generics.tryResolve(module_index, module, o, operation)).isResolved();',
              '        },',
          )
          type_new = lines(
              '        .resolve_type => blk: {',
              '            if (terminalResolution(try core.tryResolve(module_index, module, o, operation))) |done| break :blk done;',
              '            if (terminalResolution(try generics.tryResolve(module_index, module, o, operation))) |done| break :blk done;',
              '            break :blk false;',
              '        },',
          )
          call_old = lines(
              '        .resolve_call => blk: {',
              '            if ((try core.tryResolve(module_index, module, o, operation)).isResolved()) break :blk true;',
              '            if ((try generic_functions.tryResolve(module_index, module, o, operation)).isResolved()) break :blk true;',
              '            if ((try constructors.tryResolve(module_index, module, o, operation)).isResolved()) break :blk true;',
              '            if ((try abstracts.tryResolve(module_index, module, o, operation)).isResolved()) break :blk true;',
              '            break :blk (try control.tryResolve(module_index, module, o, operation)).isResolved();',
              '        },',
          )
          call_new = lines(
              '        .resolve_call => blk: {',
              '            if (terminalResolution(try core.tryResolve(module_index, module, o, operation))) |done| break :blk done;',
              '            if (terminalResolution(try generic_functions.tryResolve(module_index, module, o, operation))) |done| break :blk done;',
              '            if (terminalResolution(try constructors.tryResolve(module_index, module, o, operation))) |done| break :blk done;',
              '            if (terminalResolution(try abstracts.tryResolve(module_index, module, o, operation))) |done| break :blk done;',
              '            if (terminalResolution(try control.tryResolve(module_index, module, o, operation))) |done| break :blk done;',
              '            break :blk false;',
              '        },',
          )
          index_old = lines(
              '        .resolve_index => blk: {',
              '            if ((try core.tryResolve(module_index, module, o, operation)).isResolved()) break :blk true;',
              '            break :blk (try generic_functions.tryResolve(module_index, module, o, operation)).isResolved();',
              '        },',
          )
          index_new = lines(
              '        .resolve_index => blk: {',
              '            if (terminalResolution(try core.tryResolve(module_index, module, o, operation))) |done| break :blk done;',
              '            if (terminalResolution(try generic_functions.tryResolve(module_index, module, o, operation))) |done| break :blk done;',
              '            break :blk false;',
              '        },',
          )
          assert type_old in old and call_old in old and index_old in old
          updated = old.replace(type_old, type_new, 1).replace(call_old, call_new, 1).replace(index_old, index_new, 1)
          text = text[:start] + updated + text[end:]

          helper = lines(
              '',
              'fn terminalResolution(result: resolution.Result) ?bool {',
              '    return switch (result) {',
              '        .resolved => true,',
              '        .deferred => false,',
              '        .not_applicable => null,',
              '    };',
              '}',
              '',
          )
          insert = text.index('\nfn markUnresolvedTypeSlots(', text.index('fn resolvePendingOperation('))
          text = text[:insert] + helper + text[insert:]
          path.write_text(text)

          final = path.read_text()
          assert final.count('terminalResolution(try ') >= 9
          assert 'const resolution = @import("resolution.zig");' in final
          print('staged resolution now stops on deferred ownership')
          PY

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install LLVM 21
        run: |
          sudo apt-get update
          sudo apt-get install -y wget ca-certificates gnupg
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get install -y llvm-21-dev clang-21

      - name: Build compiler
        run: zig build

      - name: Run internal tests
        timeout-minutes: 5
        run: zig build test-internal

      - name: Commit validated routing semantics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/4_semantics/global/semantizer.zig
          git commit -m "Enforce semantic resolution ownership"
          git push origin HEAD:compact-semantic-graph-chatgpt
