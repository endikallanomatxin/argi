name: Structured global resolution result

on:
  push:
    branches:
      - compact-semantic-graph-chatgpt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace optional bool resolver protocol
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          resolution = Path('src/4_semantics/global/resolution.zig')
          assert not resolution.exists()
          resolution.write_text('''pub const Result = enum(u2) {
              not_applicable,
              deferred,
              resolved,

              pub fn fromOptionalBool(value: ?bool) Result {
                  return if (value) |done|
                      if (done) .resolved else .deferred
                  else
                      .not_applicable;
              }

              pub fn isResolved(self: Result) bool {
                  return self == .resolved;
              }
          };

          test "resolution result preserves legacy states" {
              const std = @import("std");
              try std.testing.expectEqual(Result.not_applicable, Result.fromOptionalBool(null));
              try std.testing.expectEqual(Result.deferred, Result.fromOptionalBool(false));
              try std.testing.expectEqual(Result.resolved, Result.fromOptionalBool(true));
          }
          ''')

          resolver_files = [
              'core.zig',
              'constructors.zig',
              'control.zig',
              'expressions.zig',
              'generics.zig',
              'generic_functions.zig',
              'abstracts.zig',
              'errors.zig',
              'ownership.zig',
          ]
          root = Path('src/4_semantics/global')
          for name in resolver_files:
              path = root / name
              text = path.read_text()
              assert 'pub fn tryResolve(' in text, name
              import_line = 'const resolution = @import("resolution.zig");\n'
              assert import_line not in text, name
              anchor = 'const globalizer = @import("globalizer.zig");\n'
              assert anchor in text, name
              text = text.replace(anchor, anchor + import_line, 1)

              start = text.index('    pub fn tryResolve(')
              end = text.index('\n    }\n\n', start) + len('\n    }')
              segment = text[start:end]
              count = segment.count('!?bool')
              assert count == 1, (name, count)
              segment = segment.replace('!?bool', '!resolution.Result', 1)
              assert '        return switch (operation) {' in segment, name
              segment = segment.replace(
                  '        return switch (operation) {',
                  '        const legacy: ?bool = switch (operation) {',
                  1,
              )
              suffix = '        };\n    }'
              assert segment.endswith(suffix), name
              segment = segment[:-len(suffix)] + '        };\n        return resolution.Result.fromOptionalBool(legacy);\n    }'
              text = text[:start] + segment + text[end:]
              path.write_text(text)

          sema = root / 'semantizer.zig'
          text = sema.read_text()
          changed = 0
          lines = []
          for line in text.splitlines(keepends=True):
              if 'tryResolve(' in line and ') orelse false' in line:
                  line = line.replace(') orelse false', ').isResolved()')
                  changed += 1
              lines.append(line)
          assert changed >= 10, changed
          sema.write_text(''.join(lines))

          for name in resolver_files:
              text = (root / name).read_text()
              start = text.index('    pub fn tryResolve(')
              end = text.index('\n    }\n\n', start)
              segment = text[start:end]
              assert '!resolution.Result' in segment, name
              assert '!?bool' not in segment, name
              assert 'fromOptionalBool' in segment, name
          assert ' orelse false' not in '\n'.join(
              line for line in sema.read_text().splitlines() if 'tryResolve(' in line
          )
          print('structured resolver protocol installed; orchestration behavior preserved')
          PY

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install LLVM 21
        run: |
          sudo apt-get update
          sudo apt-get install -y wget ca-certificates gnupg
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get install -y llvm-21-dev clang-21

      - name: Build compiler
        run: zig build

      - name: Run internal tests
        timeout-minutes: 5
        run: zig build test-internal

      - name: Commit validated protocol
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/4_semantics/global
          git commit -m "Make global resolution states explicit"
          git push origin HEAD:compact-semantic-graph-chatgpt
