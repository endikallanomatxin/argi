name: Share field default expression lowering

on:
  push:
    branches:
      - compact-semantic-graph-chatgpt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Route field defaults through body expression lowering
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/4_semantics/module/initializer_lowerer.zig')
          s = p.read_text()
          old = '            const value = try self.lowerExpr(default_node, field_ty);\n'
          new = (
              '            const value = try body_lowerer.lowerInitializerExpression(\n'
              '                self.allocator,\n'
              '                self.graph,\n'
              '                self.files,\n'
              '                self.file_index,\n'
              '                default_node,\n'
              '                field_ty,\n'
              '            );\n'
          )
          assert s.count(old) == 1, s.count(old)
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install LLVM 21
        run: |
          sudo apt-get update
          sudo apt-get install -y wget ca-certificates gnupg
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get install -y llvm-21-dev clang-21

      - name: Build compiler
        run: zig build

      - name: Run internal tests
        timeout-minutes: 5
        run: zig build test-internal

      - name: Commit validated refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/4_semantics/module/initializer_lowerer.zig
          git commit -m "Share field default expression lowering"
          git push origin HEAD:compact-semantic-graph-chatgpt
